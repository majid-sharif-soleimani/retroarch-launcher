name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build release APK
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: RetroArchLauncher-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK to the apk branch
        run: |
          cp app/build/outputs/apk/release/*.apk /tmp/RetroArchLauncher.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rfq .
          cp /tmp/RetroArchLauncher.apk .
          git add RetroArchLauncher.apk
          git commit -m "APK build ${GITHUB_SHA::7}"
          git push -f origin apk
